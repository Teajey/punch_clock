[package]
name = "punch_clock"
version = { workspace = true }
edition = "2021"
description = "A work-hours tracker"
repository = "https://github.com/Teajey/punch_clock"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.41"
clap = { version = "4.3.0", features = ["derive", "cargo"] }
dialoguer = { version = "0.10.4", default-features = false }
punch_clock_core = { version = "0.7.1", path = "../core" }
serde_json = "1.0.149"
thiserror = "1.0.40"

[dev-dependencies]
insta = "1.34.0"
pretty_assertions = "1.4.0"

[build-dependencies]
toml = "0.7.8"
vergen-git2 = "1.0.7"
