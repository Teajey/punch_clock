[package]
name = "punch_clock_core"
edition = "2024"
version.workspace = true

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.3.0", features = ["derive", "cargo"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "1.0.40"

[dev-dependencies]
insta = "1.34.0"
pretty_assertions = "1.4.0"
